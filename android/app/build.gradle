apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Only debug uses Metro; preview and release include JavaScript in the APK.
    debuggableVariants = ["debug"]
    autolinkLibrariesWithApp()
}

// Only the explicitly requested manual CI build can use the stable preview key.
// Normal PR builds continue using an ephemeral debug certificate.
def stablePreviewKeystore = System.getenv("COLORES_STABLE_PREVIEW_KEYSTORE")
def stablePreviewPassword = System.getenv("COLORES_STABLE_PREVIEW_PASSWORD")
def stablePreviewReady = stablePreviewKeystore != null &&
    !stablePreviewKeystore.isEmpty() &&
    stablePreviewPassword != null &&
    !stablePreviewPassword.isEmpty()

if (System.getenv("COLORES_REQUIRE_STABLE_PREVIEW") == "true" && !stablePreviewReady) {
    throw new GradleException("La firma estable solicitada no está configurada")
}

// La firma de publicación es distinta de la firma preview. Sin las dos
// variables de entorno la variante release continúa SIN firmar (preflight).
def playUploadKeystore = System.getenv("COLORIMBO_PLAY_UPLOAD_KEYSTORE")
def playUploadPassword = System.getenv("COLORIMBO_PLAY_UPLOAD_PASSWORD")
def playUploadReady = playUploadKeystore != null &&
    !playUploadKeystore.isEmpty() &&
    playUploadPassword != null &&
    !playUploadPassword.isEmpty()

if (System.getenv("COLORIMBO_REQUIRE_PLAY_UPLOAD") == "true" && !playUploadReady) {
    throw new GradleException("Faltan credenciales para firmar AAB de Google Play")
}
if (playUploadReady && !file(playUploadKeystore).isFile()) {
    throw new GradleException("No existe el keystore temporal de carga para Play")
}

android {
    signingConfigs {
        if (stablePreviewReady) {
            create("stablePreview") {
                storeFile = file(stablePreviewKeystore)
                storePassword = stablePreviewPassword
                keyAlias = "colorespreview"
                keyPassword = stablePreviewPassword
                storeType = "PKCS12"
            }
        }
        if (playUploadReady) {
            create("playUpload") {
                storeFile = file(playUploadKeystore)
                storePassword = playUploadPassword
                keyAlias = "colorimboupload"
                keyPassword = playUploadPassword
                storeType = "PKCS12"
            }
        }
    }

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.carlossan1993.colores"

    defaultConfig {
        applicationId "com.carlossan1993.colores"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "0.15.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
        release {
            // PR builds stay unsigned; ONLY a manual main workflow supplies upload secrets.
            if (playUploadReady) {
                signingConfig signingConfigs.getByName("playUpload")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        preview {
            initWith release
            matchingFallbacks = ["release"]
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            signingConfig stablePreviewReady ? signingConfigs.getByName("stablePreview") : signingConfigs.debug
            debuggable false
            resValue "string", "app_name", "Colorimbo · Prueba"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
