name: Android · APK de prueba con firma estable

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: "Run ID anterior de APK firmado para comprobar actualizaciones offline (opcional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: colores-stable-preview
  cancel-in-progress: false

jobs:
  stable-preview:
    name: APK firmado para actualizaciones entre versiones
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Exigir secretos de firma estable
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.COLORES_PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_PASSWORD: ${{ secrets.COLORES_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PREVIEW_KEYSTORE_B64" ] || [ -z "$PREVIEW_PASSWORD" ]; then
            echo "::error::Faltan los dos secretos de firma. Consultar docs/firma-estable-preview.md"
            exit 1
          fi

      - name: Reconstruir keystore temporal fuera del repositorio
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.COLORES_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          umask 077
          install -d -m 700 "$RUNNER_TEMP/colores-signing"
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/colores-signing/preview.p12"
          test -s "$RUNNER_TEMP/colores-signing/preview.p12"
          chmod 600 "$RUNNER_TEMP/colores-signing/preview.p12"
          echo "COLORES_STABLE_PREVIEW_KEYSTORE=$RUNNER_TEMP/colores-signing/preview.p12" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Verificar detección de actividades de actualización
        run: python3 -m unittest discover -s scripts -p 'test_android_upgrade_metadata.py' -v
      - name: Instalar SDK Android estable
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Compilar APK con certificado persistente
        working-directory: android
        env:
          COLORES_REQUIRE_STABLE_PREVIEW: 'true'
          COLORES_STABLE_PREVIEW_PASSWORD: ${{ secrets.COLORES_PREVIEW_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assemblePreview --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Verificar APK y comprobar certificado esperado
        env:
          COLORES_STABLE_PREVIEW_PASSWORD: ${{ secrets.COLORES_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/preview/app-preview.apk"
          python3 scripts/verify-apk.py "$apk"
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          expected=$(keytool -exportcert -rfc \
            -keystore "$COLORES_STABLE_PREVIEW_KEYSTORE" \
            -storepass:env COLORES_STABLE_PREVIEW_PASSWORD \
            -alias colorespreview |
            openssl x509 -outform DER | sha256sum | cut -d' ' -f1)
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::El APK no coincide con el certificado del keystore estable"
            exit 1
          fi
          mkdir -p artifacts
          cp "$apk" artifacts/colores-android-prueba-firmada.apk
          sha256sum artifacts/colores-android-prueba-firmada.apk > artifacts/SHA256SUMS.txt
          printf 'Certificado SHA-256 (publico): %s\n' "$actual" > artifacts/CERTIFICADO-SHA256.txt
          cp docs/firma-estable-preview.md artifacts/LEEME.md
          echo "Firma estable verificada; el archivo privado no se publica."

      - name: Publicar SOLO APK y huella publica
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: colores-apk-firma-estable-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Limpiar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/colores-signing/preview.p12"

  upgrade-check:
    name: Actualizar APK estable sin perder dibujos offline
    if: ${{ inputs.baseline_run_id != '' }}
    needs: stable-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Localizar APK firmado anterior
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::baseline_run_id debe ser un número"
            exit 1
          fi
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("colores-apk-firma-estable-"))) | .name] | first // ""')
          if [ -z "$artifact" ]; then
            echo "::error::El APK baseline no existe o el artefacto caducó (7 días)"
            exit 1
          fi
          echo "name=$artifact" >> "$GITHUB_OUTPUT"
      - name: Descargar APK firmado anterior
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.baseline.outputs.name }}
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
          path: baseline-apk
      - name: Descargar APK nuevo
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: colores-apk-firma-estable-${{ github.run_number }}
          path: upgraded-apk
      - name: Instalar herramientas Android
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "build-tools;36.0.0"
      - name: Acelerar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actualizar APK histórico al actual sin borrar progreso
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 scripts/check-android-upgrade.py baseline-apk/colores-android-prueba-firmada.apk upgraded-apk/colores-android-prueba-firmada.apk
      - name: Publicar evidencia de actualización
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: colores-upgrade-${{ github.run_number }}
          path: upgrade-artifacts/
          if-no-files-found: warn
          retention-days: 7
