name: Play · Validar AAB sin firma (preflight)

on:
  pull_request:
    paths:
      - ".github/workflows/aab-preflight.yml"
      - "scripts/verify-aab.py"
      - "docs/play-store-checklist.md"
      - "android/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aab-preflight.yml"
      - "scripts/verify-aab.py"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aab-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: Compilar y verificar AAB sin clave de publicación
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Instalar dependencias y verificar código
        run: |
          npm ci --no-audit --no-fund
          npm run verify
      - name: Preparar SDK Android
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Generar AAB release sin firma de publicación
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verificar estructura del App Bundle
        run: python3 scripts/verify-aab.py android/app/build/outputs/bundle/release/app-release.aab
      - name: Aviso de seguridad
        run: |
          echo "AAB de preflight validado. NO está firmado ni listo para Play Console."
          echo "No se publica AAB como artefacto y no se usan secretos de firma."
